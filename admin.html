<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="img/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="index.html"></a>
  <nav class="nav" id="nav"></nav>
  <div class="top-end"><a class="follow" id="follow"></a><div class="row" id="userbox"></div></div>
</div></header>
<main class="page" id="root"><div class="empty">جاري التحميل...</div></main>
<div class="overlay" id="uEdit">
  <button class="btn ghost x" id="ueClose">إغلاق ✕</button>
  <div class="edit-box">
    <h2 id="ueTitle"></h2>
    <div class="field"><label>يوزر ستيك</label><input id="ueStake" dir="ltr" maxlength="40" autocomplete="off"></div>
    <div class="field"><label>عنوان USDT (BSC)</label><input id="ueWallet" dir="ltr" maxlength="42" autocomplete="off" spellcheck="false"></div>
    <div class="msg" id="ueDiscord" style="text-align:start"></div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="ueSave">حفظ التعديل</button>
      <button class="btn danger" id="ueUnlink">فك ربط الديسكورد</button>
    </div>
    <p class="hint">المستخدم ما بيقدر يعدّل هالبيانات بنفسه. فك ربط الديسكورد بيلغي توثيقه ويسمحله يربط من جديد.</p>
  </div>
</div>
<div class="overlay" id="draw">
  <button class="btn ghost x" id="drawClose">إغلاق ✕</button>
  <button class="btn ghost small" id="dSound" style="position:absolute;top:18px;inset-inline-end:18px">🔊 الصوت</button>
  <h2 id="dTitle"></h2>
  <div class="prize" id="dPrize"></div>
  <div class="hint" id="dInfo"></div>
  <div class="case" id="case"><div class="case-marker"></div><div class="case-track" id="track"></div></div>
  <div class="reveal" id="reveal"></div>
  <div class="wlist" id="wlist"></div>
  <div class="row">
    <button class="btn primary" id="dStart">ابدأ السحب 🎲</button>
    <button class="btn ghost" id="dMore" style="display:none">سحب فائز إضافي</button>
  </div>
</div>
<script src="js/i18n.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/fair.js"></script>
<script src="js/reel.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
